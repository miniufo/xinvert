name: tests

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@835234971496cad1653abb28a638a281cf32541f
        with:
          miniconda-version: latest
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yml
          activate-environment: xinvert
          auto-activate-base: false
      - name: List installed packages
        shell: bash -l {0}
        run: conda list
      - name: Test CPU path
        shell: bash -l {0}
        run: python -m pytest -q

  gpu:
    if: ${{ vars.XINVERT_GPU_RUNNER != '' }}
    runs-on: ${{ vars.XINVERT_GPU_RUNNER }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: conda-incubator/setup-miniconda@835234971496cad1653abb28a638a281cf32541f
        with:
          miniconda-version: latest
          environment-file: environment.yml
          activate-environment: xinvert
          auto-activate-base: false
      - name: Run GPU consistency tests
        shell: bash -l {0}
        run: python -m pytest -q tests/test_CpuGpuConsistency.py tests/test_GpuGeneral2D.py
