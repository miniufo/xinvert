name: tests

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@835234971496cad1653abb28a638a281cf32541f
        with:
          miniconda-version: latest
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yml
          activate-environment: xinvert
          auto-activate-base: false
      - name: List installed packages
        shell: bash -l {0}
        run: conda list
      # create_animation falls back to ``shutil.which('ffmpeg')``, and the conda
      # imageio-ffmpeg package ships no binary of its own, so the encoder tests
      # need a real ffmpeg on PATH.  Installed here rather than in
      # environment.yml: adding it there re-solved the whole environment (numpy
      # 2.0.2 -> 1.26.4 on py3.9) and broke unrelated numerical tests.
      - name: Install FFmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ffmpeg --no-progress -y
            # Chocolatey drops its shims in %ProgramData%\chocolatey\bin, which
            # is not on the PATH a job inherits, so publish it for later steps.
            echo 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Check public module imports
        shell: bash -l {0}
        run: |
          python -c "import xinvert; import xinvert.domain; import xinvert.helmholtz"
          # Printed so an encoder test that only skips stays visible in the log.
          python -c "import shutil; print('ffmpeg:', shutil.which('ffmpeg'))"
      - name: Test CPU path
        env:
          NUMBA_DISABLE_CUDA: '1'
        shell: bash -l {0}
        run: python -m pytest -q

  # Optional self-hosted GPU runner; normal hosted CI runs the CPU matrix above.
  gpu:
    if: ${{ vars.XINVERT_GPU_RUNNER != '' }}
    runs-on: ${{ vars.XINVERT_GPU_RUNNER }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: conda-incubator/setup-miniconda@835234971496cad1653abb28a638a281cf32541f
        with:
          miniconda-version: latest
          environment-file: environment.yml
          activate-environment: xinvert
          auto-activate-base: false
      - name: Install complete GPU dependencies
        shell: bash -l {0}
        run: python -m pip install -e ".[gpu]"
      - name: Run GPU consistency tests
        env:
          XINVERT_TEST_LI_GPU: '1'
        shell: bash -l {0}
        run: python -m pytest -q tests/test_Gpu*.py tests/test_CpuGpuConsistency.py tests/test_backend_math.py tests/test_backend_apps.py tests/test_masked_poisson.py tests/test_masked_applications.py tests/test_Convergence.py tests/test_animation_streaming.py tests/test_li_gpu.py tests/test_li_gpu_errors.py tests/test_helmholtz_diagnostics.py tests/test_dtype_policy.py
