name: xinvert
channels:
  - conda-forge
dependencies:
  - python
  - pytest
  - numpy
  - xarray
  - dask
  - scipy
  - netCDF4
  - matplotlib
  - imageio-ffmpeg
  - cloudpickle
  # create_animation falls back to ``shutil.which('ffmpeg')``, and the conda
  # imageio-ffmpeg package ships no binary of its own, so the CI matrix needs a
  # real ffmpeg on PATH or the encoding tests can only skip.
  - ffmpeg
  - numba
  - ultraplot
  - cartopy
  - pooch
  - ipykernel
  # test-suite extras: nbclient/nbformat drive the Jupyter regression test,
  # distributed drives the dask-client serialisation test (both use
  # importorskip, so a missing package skips rather than fails)
  - nbclient
  - nbformat
  - distributed
