name: xinvert
channels:
  - conda-forge
dependencies:
  - python
  - pytest
  - numpy
  - xarray
  - dask
  - scipy
  - netCDF4
  - numba
  - ultraplot
  - cartopy
  - pooch
  - ipykernel
  # test-suite extras: nbclient/nbformat drive the Jupyter regression test,
  # distributed drives the dask-client serialisation test (both use
  # importorskip, so a missing package skips rather than fails)
  - nbclient
  - nbformat
  - distributed
